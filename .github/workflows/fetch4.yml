name: wayback-fetch4
on: { workflow_dispatch: {} }
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: ./fetch4.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: discover4, path: out4/ }
